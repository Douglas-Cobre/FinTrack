spring:
  application:
    name: fintrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:8318}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fintrack:
  jwt:
    secret: ${JWT_SECRET:fintrack-chave-local-de-desenvolvimento-com-mais-de-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
