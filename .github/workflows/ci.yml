name: Validacao FinTrack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintrack_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste-ci-isolado
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fintrack_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes unitarios, migracoes e concorrencia PostgreSQL
        working-directory: backend
        env:
          PG_TEST_URL: jdbc:postgresql://localhost:5432/fintrack_test_ci
          PG_TEST_USERNAME: postgres
          PG_TEST_PASSWORD: teste-ci-isolado
        run: mvn -B -Ppostgres verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente temporario de producao
        shell: bash
        run: |
          umask 077
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 64)" > .env.production
          docker compose --env-file .env.production -f compose.production.yml config --quiet
          docker compose --env-file .env.production -f compose.production.yml up -d --build --wait --wait-timeout 240
      - name: HTTP, proxy e rota Angular
        shell: bash
        run: |
          curl --fail http://127.0.0.1:8088/healthz
          curl --fail http://127.0.0.1:8088/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"'
          curl --fail http://127.0.0.1:8088/financeiro | grep -q '<app-root'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/contas-financeiras)" = 401
      - name: Backup e restauracao em banco temporario
        shell: bash
        run: |
          bash scripts/backup-production.sh
          bash scripts/verify-backup-production.sh backups/*.dump
      - name: Logs e limpeza do ambiente CI
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.production -f compose.production.yml logs --no-color
          docker compose --env-file .env.production -f compose.production.yml down -v
